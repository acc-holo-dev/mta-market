version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mta-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtamarket
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: mtamarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtamarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mta-market-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
